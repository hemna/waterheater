<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Water Heater - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/main.css?v=7" rel="stylesheet">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 360px;
        }
        .login-card .card-title {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-error {
            color: var(--color-danger, #e74c3c);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <h1 class="card-title">🔥 Water Heater</h1>
            {% if error %}
            <p class="login-error">{{ error }}</p>
            {% endif %}
            <form method="POST" action="/login">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" autofocus required>
                </div>
                <button type="submit" class="btn btn-start w-100">Log in</button>
            </form>
        </div>
    </div>
</body>
</html>
